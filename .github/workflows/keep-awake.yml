# Keep the free Render instance awake: ping /api/ping every 5 minutes
# so it never hits the 15-minute idle spin-down. Public repo = free minutes.
# Manual runs: Actions tab -> "Keep Render awake" -> Run workflow.
#
# IMPORTANT: this workflow is only BACKUP. GitHub cron is best-effort — runs
# can lag 10-30+ min under load, and GitHub auto-disables scheduled workflows
# after 60 days without repo activity. A single gap >15 min puts Render back
# to sleep. The PRIMARY keep-awake must be a dedicated pinger
# (cron-job.org every 1-5 min and/or UptimeRobot every 5 min) pointing at
# /api/ping — see DEPLOY.md. This workflow just covers pinger outages.
#
# Optional repo secret RENDER_PING_URL: full ping URL
# (e.g. https://<ваш-сервис>.onrender.com/api/ping). Falls back to the
# hardcoded URL below — update it if the service is renamed.

name: Keep Render awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Ping production (retry cold-start, fail loudly on error)
        env:
          PING_URL: ${{ secrets.RENDER_PING_URL }}
        run: |
          URL="${PING_URL:-https://sui-cleaner.onrender.com/api/ping}"
          echo "pinging $URL ..."
          for i in 1 2 3; do
            if curl --fail --max-time 60 -sS -o /dev/null "$URL"; then
              echo "$(date -u +%FT%TZ) ping ok (attempt $i)"
              exit 0
            fi
            echo "$(date -u +%FT%TZ) attempt $i failed, waiting 30s..."
            sleep 30
          done
          echo "all ping attempts failed"
          exit 1
